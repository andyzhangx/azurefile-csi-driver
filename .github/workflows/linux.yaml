name: Ubuntu Build & Unit Test

on:
    pull_request: {}
    push: {}

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ^1.16
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build Test
      run: |
        make

    - name: Unit Test
      run: go test -race -covermode=atomic -coverprofile=profile.cov ./pkg/... -timeout=30m

    - name: Install goveralls
      run: go install github.com/mattn/goveralls@latest

    - name: Send coverage
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: goveralls -coverprofile=profile.cov -service=github -ignore=pkg/azurefile/azurefile_interface_mock.go,pkg/azurefile/directvolume_mock.go,pkg/azurefile/directvolume_interface.go,pkg/azurefile/resolver_interface.go
